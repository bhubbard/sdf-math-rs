[package]
name = "sdf-math-rs"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard"]
description = "Pure Rust 2D and 3D Signed Distance Fields, CSG smooth blending, and ray marching from Inigo Quilez"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/sdf-math-rs"
keywords = ["sdf", "signed-distance-field", "raymarching", "glam", "inigo-quilez"]
categories = ["graphics", "mathematics", "rendering"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"
